# PostgreSQL (os valores são substituídos pelas variáveis do docker-compose.yml)
spring.datasource.url=jdbc:postgresql://localhost:5432/catalogo
spring.datasource.username=catalogo
spring.datasource.password=catalogo

# A tabela é criada pelo script banco/init.sql; o Hibernate não altera o esquema
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2s
spring.cache.type=redis
